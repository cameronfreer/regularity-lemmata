name = "RegularityLemmata"
version = "0.9.0"
defaultTargets = ["RegularityLemmata", "RegularityLemmataGates"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#77cbcbc65f9e26f6ede0a01b24c2cb909e11cc0d"

[[lean_lib]]
name = "RegularityLemmata"

# The probe/gate umbrella: same source tree and namespace, separate root, so the public
# surface (`import RegularityLemmata`) no longer pulls in the in-progress campaign modules
# while CI still builds and audits them.
[[lean_lib]]
name = "RegularityLemmataGates"

[[lean_exe]]
name = "axiom_audit"
root = "scripts.AxiomAudit"
supportInterpreter = true
