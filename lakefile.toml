name = "RegularityLemmata"
version = "0.11.0"
defaultTargets = ["RegularityLemmata", "RegularityLemmataGates", "RegularityLemmataExamples"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#77cbcbc65f9e26f6ede0a01b24c2cb909e11cc0d"

[[lean_lib]]
name = "RegularityLemmata"

# The probe/gate umbrella: same source tree and namespace, separate root, so the public
# surface (`import RegularityLemmata`) no longer pulls in the in-progress campaign modules
# while CI still builds and audits them.
[[lean_lib]]
name = "RegularityLemmataGates"

# Worked specializations, compiled against the advertised imports only (the `Kernel` facade).
# Built by default so the gate compiles them; not part of the public surface.
[[lean_lib]]
name = "RegularityLemmataExamples"
srcDir = "examples"
roots = ["OrdinaryMatrix", "WeightedBipartiteGraph", "SignedResidual"]

[[lean_exe]]
name = "axiom_audit"
root = "scripts.AxiomAudit"
supportInterpreter = true
