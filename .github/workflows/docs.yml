#
# Generated API documentation (doc-gen4) on GitHub Pages, versioned per release. The layout
# and the size budget are handled by scripts/deploy_docs.sh: one shared dependency tree per
# Mathlib pin, a small directory per version, `latest` as a redirect.
name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to document (also the version directory name)"
        required: true
        default: "main"
      update_latest:
        description: "Also point latest/ at this version (use when re-publishing a release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DOCS_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref }}
    steps:
      # Two checkouts. The deployment tooling (this workflow's scripts) comes from the revision
      # the workflow itself runs at, so a fix to the tooling applies when an older release is
      # re-documented; the documented source is checked out separately under `src/`.
      # actions/checkout v7.0.0, pinned to an immutable revision
      - name: Check out the tooling (the workflow's own revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the documented source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCS_VERSION }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version name and record both revisions
        run: |
          [[ "$DOCS_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid version name" >&2; exit 1; }
          echo "tooling_revision=$(git rev-parse HEAD)"
          echo "documented_revision=$(git -C src rev-parse HEAD)"

      - name: Verify the release tag before allowing latest to move
        if: ${{ github.event_name == 'release' || inputs.update_latest == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DOCS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $DOCS_VERSION" >&2; exit 1; }
          test "$(git -C src cat-file -t "refs/tags/$DOCS_VERSION")" = tag
          test "$(git -C src rev-parse "refs/tags/$DOCS_VERSION^{commit}")" = "$(git -C src rev-parse HEAD)"
          gh release view "$DOCS_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | grep -qx "$DOCS_VERSION"
          echo "DOCS_RELEASE_TAG_OK=1" >> "$GITHUB_ENV"
          echo "release tag $DOCS_VERSION verified (annotated, at the documented revision, published)"

      - name: Install elan
        # elan v4.2.3 installer, pinned to an immutable revision
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache dependency compilation only
        # actions/cache v6.1.0, pinned to an immutable revision. Only the dependency packages
        # are cached; documentation outputs and their Lake metadata are regenerated on every
        # run, because doc-gen4's final HTML step was observed to replay from its trace after
        # the library's doc data had changed (stale pages with old links).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src/docbuild/.lake/packages
          key: docs-packages-${{ hashFiles('src/lean-toolchain', 'src/lake-manifest.json', 'src/docbuild/lakefile.toml') }}

      - name: Build the documentation
        working-directory: src/docbuild
        run: |
          rm -rf .lake/build
          lake update
          lake exe cache get
          lake build RegularityLemmata:docs

      - name: Check out gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" pages
          else
            git init --quiet pages && git -C pages switch --quiet --orphan gh-pages
            git -C pages remote add origin "$url"
          fi

      - name: Lay out the version (tooling from this revision, source from src/)
        env:
          DOCS_SRC: src/docbuild/.lake/build/doc
          PAGES_DIR: pages
          DOCS_UPDATE_LATEST: ${{ (github.event_name == 'release' || inputs.update_latest == true) && '1' || '0' }}
        run: |
          DEPS_KEY=$(python3 -c "import json;print([p['rev'] for p in json.load(open('src/lake-manifest.json'))['packages'] if p['name']=='mathlib'][0][:12])")
          export DEPS_KEY
          python3 scripts/docs_layout.py deploy-test
          bash scripts/deploy_docs.sh

      - name: Publish
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "docs: $DOCS_VERSION (tooling $GITHUB_SHA)" || { echo "nothing to publish"; exit 0; }
          git push --quiet origin gh-pages
